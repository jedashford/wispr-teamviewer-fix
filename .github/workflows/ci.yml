name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: xcrun swiftc -O wispr-teamviewer-fix.swift -o wispr-teamviewer-fix
      - run: ./wispr-teamviewer-fix --selftest
      - run: ./wispr-teamviewer-fix --version

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh uninstall.sh
